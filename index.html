<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Geometry Dash Ultimate</title><style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap');

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: black;
  font-family: 'Orbitron', sans-serif;
}

canvas {
  display: block;
}

#ui {
  position: absolute;
  top: 50px;
  left: 15px;
  color: white;
  font-size: 22px;
  font-weight: 700;
  background: rgba(0,0,0,0.35);
  padding: 12px 18px;
  border-radius: 16px;
  backdrop-filter: blur(10px);
  z-index: 10;
}

#gameOver {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 42px;
  text-align: center;
  display: none;
  background: rgba(0,0,0,0.5);
  padding: 30px 45px;
  border-radius: 25px;
}

  #logo {
    height:50px;
    width:auto;
    top:;
    left:;
  }
</style></head>
<body><div id="ui">
  Score: <span id="score">0</span><br>
  Best: <span id="best">0</span>
</div><div id="gameOver">
  GAME OVER<br><br>
  Press SPACE To Restart
</div><canvas id="game"></canvas>
<img class="logo" src="logo.png">
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const gameOverEl = document.getElementById('gameOver');

let gravity = 0.9;
let jumpForce = -17;
let gameSpeed = 8;
let score = 0;
let gameOver = false;
let particles = [];
let obstacles = [];
let bgOffset = 0;

let best = localStorage.getItem('gd_best') || 0;
bestEl.textContent = best;

const player = {
  x: 150,
  y: 0,
  width: 50,
  height: 50,
  velY: 0,
  grounded: false,
  rotation: 0,

  draw() {
    ctx.save();

    ctx.translate(this.x + this.width/2, this.y + this.height/2);
    ctx.rotate(this.rotation);

    let grad = ctx.createLinearGradient(-25,-25,25,25);
    grad.addColorStop(0, '#00f5ff');
    grad.addColorStop(1, '#7b2cff');

    ctx.shadowBlur = 25;
    ctx.shadowColor = '#00f5ff';

    ctx.fillStyle = grad;
    ctx.fillRect(-25,-25,50,50);

    ctx.fillStyle = 'white';
    ctx.fillRect(-12,-10,8,8);
    ctx.fillRect(5,-10,8,8);

    ctx.restore();
  },

  update() {
    this.velY += gravity;
    this.y += this.velY;

    if (!this.grounded) {
      this.rotation += 0.12;
    }

    let ground = canvas.height - 160;

    if (this.y >= ground) {
      this.y = ground;
      this.velY = 0;
      this.grounded = true;
      this.rotation = 0;
    }
  },

  jump() {
    if (this.grounded && !gameOver) {
      this.velY = jumpForce;
      this.grounded = false;
    }
  }
};

player.y = canvas.height - 160;

class Obstacle {
  constructor() {
    this.width = Math.random() > 0.7 ? 80 : 50;
    this.height = Math.random() * 70 + 40;
    this.x = canvas.width + 100;
    this.y = canvas.height - 110 - this.height;
  }

  draw() {
    let grad = ctx.createLinearGradient(this.x,this.y,this.x,this.y+this.height);
    grad.addColorStop(0, '#ff006e');
    grad.addColorStop(1, '#ffbe0b');

    ctx.fillStyle = grad;
    ctx.shadowBlur = 20;
    ctx.shadowColor = '#ff006e';

    ctx.beginPath();
    ctx.moveTo(this.x, this.y + this.height);
    ctx.lineTo(this.x + this.width/2, this.y);
    ctx.lineTo(this.x + this.width, this.y + this.height);
    ctx.closePath();
    ctx.fill();

    ctx.shadowBlur = 0;
  }

  update() {
    this.x -= gameSpeed;
  }
}

function spawnObstacle() {
  if (!gameOver) {
    obstacles.push(new Obstacle());
  }

  let delay = Math.random() * 1200 + 900;
  setTimeout(spawnObstacle, delay);
}

function drawBackground() {
  bgOffset += 0.01;

  let gradient = ctx.createLinearGradient(0,0,0,canvas.height);
  gradient.addColorStop(0, `hsl(${220 + Math.sin(bgOffset)*50}, 80%, 18%)`);
  gradient.addColorStop(1, '#050505');

  ctx.fillStyle = gradient;
  ctx.fillRect(0,0,canvas.width,canvas.height);

  for (let i=0;i<120;i++) {
    ctx.fillStyle = 'rgba(255,255,255,0.12)';

    let x = (i * 120 - (Date.now()*0.08 % 120));
    let y = 120 + Math.sin(i + bgOffset) * 100;

    ctx.fillRect(x,y,3,3);
  }
}

function drawGround() {
  let groundGrad = ctx.createLinearGradient(0,canvas.height-110,0,canvas.height);
  groundGrad.addColorStop(0,'#00f5ff');
  groundGrad.addColorStop(1,'#0066ff');

  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, canvas.height - 110, canvas.width, 110);
}

function createParticles(x,y) {
  for (let i=0;i<40;i++) {
    particles.push({
      x,
      y,
      vx:(Math.random()-0.5)*15,
      vy:(Math.random()-0.5)*15,
      size:Math.random()*6+2,
      life:1,
      color:Math.random()>0.5 ? '#00f5ff' : '#ff006e'
    });
  }
}

function updateParticles() {
  particles.forEach((p,index)=>{
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.02;

    ctx.globalAlpha = p.life;
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x,p.y,p.size,p.size);
    ctx.globalAlpha = 1;

    if (p.life <= 0) {
      particles.splice(index,1);
    }
  });
}

function collision(a,b) {
  return (
    a.x < b.x + b.width &&
    a.x + a.width > b.x &&
    a.y < b.y + b.height &&
    a.y + a.height > b.y
  );
}

function restart() {
  score = 0;
  scoreEl.textContent = score;
  gameSpeed = 8;
  obstacles = [];
  particles = [];
  gameOver = false;

  player.y = canvas.height - 160;
  player.velY = 0;
  player.rotation = 0;
  player.grounded = true;

  gameOverEl.style.display = 'none';

  animate();
}

function animate() {
  if (gameOver) return;

  requestAnimationFrame(animate);

  drawBackground();
  drawGround();

  player.update();
  player.draw();

  obstacles.forEach((obs,index)=>{
    obs.update();
    obs.draw();

    if (collision(player,obs)) {
      createParticles(player.x+25, player.y+25);
      gameOver = true;
      gameOverEl.style.display = 'block';
    }

    if (obs.x + obs.width < 0) {
      obstacles.splice(index,1);
      score++;
      scoreEl.textContent = score;

      if (score > best) {
        best = score;
        localStorage.setItem('gd_best', best);
        bestEl.textContent = best;
      }

      if (score % 3 === 0) {
        gameSpeed += 0.4;
      }
    }
  });

  updateParticles();

  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  ctx.fillRect(30,30,canvas.width-60,10);

  ctx.fillStyle = '#00f5ff';
  ctx.fillRect(30,30,(score % 100)/100*(canvas.width-60),10);
}

window.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    if (gameOver) {
      restart();
    } else {
      player.jump();
    }
  }
});

window.addEventListener('mousedown', ()=> player.jump());
window.addEventListener('touchstart', ()=> player.jump());

window.addEventListener('resize', ()=> {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
});

spawnObstacle();
animate();
</script></body>
</html>
