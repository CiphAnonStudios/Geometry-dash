<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Advanced Geometry Dash Style Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }body {
  overflow: hidden;
  background: #111;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
  background: linear-gradient(#1a1a2e, #16213e);
}

#ui {
  position: absolute;
  top: 15px;
  left: 15px;
  color: white;
  font-size: 24px;
  z-index: 10;
}

#restartText {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 36px;
  text-align: center;
  display: none;
  z-index: 20;
}

  </style>
</head>
<body>
  <div id="ui">Score: <span id="score">0</span></div>
  <div id="restartText">
    Game Over<br>
    Press SPACE to Restart
  </div><canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const gravity = 0.9;
    const jumpForce = -15;
    const groundHeight = 120;

    let gameSpeed = 8;
    let particles = [];
    let screenShake = 0;
    let levelProgress = 0;
    let score = 0;
    let gameOver = false;

    const player = {
      x: 150,
      y: canvas.height - groundHeight - 50,
      width: 50,
      height: 50,
      velocityY: 0,
      rotation: 0,
      grounded: true,

      draw() {
        ctx.save();
        ctx.translate(this.x + this.width / 2, this.y + this.height / 2);
        ctx.rotate(this.rotation);

        ctx.fillStyle = '#00f5ff';
        ctx.fillRect(-this.width / 2, -this.height / 2, this.width, this.height);

        ctx.fillStyle = '#fff';
        ctx.fillRect(-10, -10, 8, 8);
        ctx.fillRect(5, -10, 8, 8);

        ctx.restore();
      },

      update() {
        this.velocityY += gravity;
        this.y += this.velocityY;

        if (!this.grounded) {
          this.rotation += 0.12;
        }

        const groundY = canvas.height - groundHeight - this.height;

        if (this.y >= groundY) {
          this.y = groundY;
          this.velocityY = 0;
          this.grounded = true;
          this.rotation = 0;
        }
      },

      jump() {
        if (this.grounded && !gameOver) {
          this.velocityY = jumpForce;
          this.grounded = false;
        }
      }
    };

    const obstacles = [];

    class Obstacle {
      constructor() {
        this.width = 50;
        this.height = Math.random() * 70 + 40;
        this.x = canvas.width + this.width;
        this.y = canvas.height - groundHeight - this.height;
      }

      draw() {
        ctx.fillStyle = '#ff006e';

        ctx.beginPath();
        ctx.moveTo(this.x, this.y + this.height);
        ctx.lineTo(this.x + this.width / 2, this.y);
        ctx.lineTo(this.x + this.width, this.y + this.height);
        ctx.closePath();
        ctx.fill();
      }

      update() {
        this.x -= gameSpeed;
      }
    }

    function spawnObstacle() {
      if (gameOver) return;

      obstacles.push(new Obstacle());

      const nextSpawn = Math.random() * 1200 + 900;
      setTimeout(spawnObstacle, nextSpawn);
    }

    function drawGround() {
      ctx.fillStyle = '#2ec4b6';
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);

      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 3;

      for (let i = 0; i < canvas.width; i += 60) {
        ctx.beginPath();
        ctx.moveTo(i, canvas.height - groundHeight);
        ctx.lineTo(i + 30, canvas.height - groundHeight + 20);
        ctx.stroke();
      }
    }

    function collision(a, b) {
      return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
      );
    }

    function restartGame() {
      score = 0;
      gameOver = false;
      gameSpeed = 7;

      obstacles.length = 0;

      player.y = canvas.height - groundHeight - 50;
      player.velocityY = 0;
      player.rotation = 0;
      player.grounded = true;

      document.getElementById('restartText').style.display = 'none';

      spawnObstacle();
    }

    function update() {
      ctx.save();

      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake;
        const shakeY = (Math.random() - 0.5) * screenShake;
        ctx.translate(shakeX, shakeY);
        screenShake *= 0.9;
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawBackground();
      drawGround();

      player.update();
      player.draw();
      drawTrail();

      obstacles.forEach((obstacle, index) => {
        obstacle.update();
        obstacle.draw();

        if (collision(player, obstacle)) {
          createExplosion(player.x + player.width / 2, player.y + player.height / 2);
          screenShake = 20;
          gameOver = true;
          document.getElementById('restartText').style.display = 'block';
        }

        if (obstacle.x + obstacle.width < 0) {
          obstacles.splice(index, 1);
          score++;
          document.getElementById('score').textContent = score;

          if (score % 5 === 0) {
            gameSpeed += 0.5;
          }
        }
      });

      if (!gameOver) {
        updateParticles();

        levelProgress += 0.005;
        requestAnimationFrame(update);
      }

      ctx.restore();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (gameOver) {
          restartGame();
          update();
        } else {
          player.jump();
        }
      }
    });

    window.addEventListener('mousedown', () => {
      player.jump();
    });

    window.addEventListener('touchstart', () => {
      player.jump();
    });

    function drawBackground() {
      const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
      gradient.addColorStop(0, `hsl(${200 + Math.sin(levelProgress) * 40}, 70%, 18%)`);
      gradient.addColorStop(1, '#111');

      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = 0; i < 40; i++) {
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillRect((i * 200 - (Date.now() * 0.05 % 200)), 100 + Math.sin(i + levelProgress) * 50, 4, 4);
      }
    }

    function drawTrail() {
      ctx.fillStyle = 'rgba(0,245,255,0.35)';
      ctx.fillRect(player.x - 15, player.y + 10, 15, 30);
    }

    function createExplosion(x, y) {
      for (let i = 0; i < 35; i++) {
        particles.push({
          x,
          y,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.5) * 14,
          size: Math.random() * 6 + 2,
          life: 1
        });
      }
    }

    function updateParticles() {
      particles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.02;
        p.size *= 0.98;

        ctx.globalAlpha = p.life;
        ctx.fillStyle = '#00f5ff';
        ctx.fillRect(p.x, p.y, p.size, p.size);
        ctx.globalAlpha = 1;

        if (p.life <= 0) {
          particles.splice(index, 1);
        }
      });
    }

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    spawnObstacle();
    update();
  </script></body>
</html>
